<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Linux-container evaluation activity layers</title>
  <desc id="desc">Two independent coverage columns: the Linux-specific method applies only to the running TOE payload, using its exact deployed instance and effective execution context. Artifact, lifecycle, runtime, configuration, interface, and channel activity portions remain applicable at their own scope. Packaging does not determine the TOE boundary, and the method does not establish Product or Platform Equivalence.</desc>
  <style>
    .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .subtitle { font: 18px Arial, Helvetica, sans-serif; fill: #dbeafe; }
    .section { font: 700 26px Arial, Helvetica, sans-serif; fill: #0b3a67; }
    .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #102a43; }
    .body { font: 21px Arial, Helvetica, sans-serif; fill: #243b53; }
    .small { font: 18px Arial, Helvetica, sans-serif; fill: #334e68; }
    .payload { fill: #f0fbfd; stroke: #087e8b; stroke-width: 2; }
    .running { fill: #e9f7ef; stroke: #287d52; stroke-width: 3; }
    .oe { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .retained { fill: #fff8e7; stroke: #a86600; stroke-width: 2; }
  </style>

  <rect width="1400" height="760" fill="#ffffff"/>
  <rect width="1400" height="80" fill="#0b3a67"/>
  <text x="36" y="37" class="title">Illustrative Linux-container evaluation activity layers</text>
  <text x="36" y="65" class="subtitle">Explanatory only: the activity subject determines the layer; the Linux method does not displace other coverage.</text>

  <text x="36" y="135" class="section">Linux method: running payload only</text>
  <text x="36" y="165" class="body">Activity scope follows its subject, not its packaging.</text>
  <text x="714" y="135" class="section">Other coverage remains applicable</text>
  <text x="714" y="165" class="body">Independent activity portions, at their stated scope.</text>

  <rect x="36" y="188" width="648" height="131" rx="14" class="payload"/>
  <text x="60" y="222" class="label">TOE artifact / image</text>
  <text x="60" y="252" class="body"><tspan x="60">TOE content: payload, libraries, helpers, and</tspan><tspan x="60" dy="26">SFR-supporting sidecars delivered with it.</tspan></text>
  <text x="60" y="303" class="small">Packaging alone does not determine the TOE boundary.</text>

  <rect x="36" y="338" width="648" height="160" rx="14" class="running"/>
  <rect x="36" y="354" width="6" height="128" rx="3" fill="#287d52"/>
  <text x="60" y="373" class="label">Running TOE application payload</text>
  <text x="60" y="404" class="body">Running Linux userspace behavior</text>
  <text x="60" y="436" class="body" style="font-weight:700; fill:#287d52">Linux-specific Evaluation Activity method applies here.</text>
  <text x="60" y="469" class="small">Exact deployed instance and effective execution context</text>

  <text x="60" y="535" class="body">Enter or instrument only as the activity permits.</text>
  <text x="60" y="568" class="body"><tspan x="60">The method does not alter the deployment</tspan><tspan x="60" dy="27">or establish Product or Platform Equivalence.</tspan></text>

  <rect x="36" y="617" width="648" height="108" rx="14" class="oe"/>
  <text x="60" y="650" class="label">Operational environment: beneath or beside</text>
  <text x="60" y="679" class="small"><tspan x="60">Container runtime, host kernel, orchestrator, mesh or ingress,</tspan><tspan x="60" dy="25">mounts, and platform stores</tspan></text>

  <rect x="714" y="188" width="650" height="122" rx="14" class="retained"/>
  <text x="738" y="222" class="label">Artifact and image</text>
  <text x="738" y="251" class="body"><tspan x="738">Identity, composition, SBOM, signature,</tspan><tspan x="738" dy="25">and authorized source</tspan></text>
  <text x="738" y="299" class="small">Not a Running-Payload Activity</text>

  <rect x="714" y="326" width="650" height="122" rx="14" class="retained"/>
  <text x="738" y="360" class="label">Lifecycle and update</text>
  <text x="738" y="389" class="body"><tspan x="738">Installation, replacement, removal, recovery,</tspan><tspan x="738" dy="25">and rollback</tspan></text>
  <text x="738" y="437" class="small">At the stated lifecycle scope</text>

  <rect x="714" y="464" width="650" height="122" rx="14" class="retained"/>
  <text x="738" y="498" class="label">Runtime and configuration</text>
  <text x="738" y="527" class="body"><tspan x="738">Runtime / orchestrator controls, mounts,</tspan><tspan x="738" dy="25">injected values, and stores</tspan></text>
  <text x="738" y="575" class="small">At the effective source and attachment layer</text>

  <rect x="714" y="602" width="650" height="122" rx="14" class="retained"/>
  <text x="738" y="636" class="label">Interfaces and channels</text>
  <text x="738" y="665" class="body"><tspan x="738">Network policy, external interfaces, identities,</tspan><tspan x="738" dy="25">protection, and trust</tspan></text>
  <text x="738" y="713" class="small">Channel-specific coverage is retained</text>
</svg>
