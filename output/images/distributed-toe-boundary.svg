<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative distributed TOE boundary and evaluation mapping</title>
  <desc id="desc">Logical TOE Components A, B, and TOE-provided support C are mapped to their deployed Component Instances. A and B may have Runtime Replicas when claimed behavior and relevant configuration are the same. Solid R1 and R2 lines identify relationship types without implying traffic direction. A dashed line identifies TOE-to-operational-environment dependencies, not trust. SFR allocation and all stated Evaluation Activity coverage remain required.</desc>
  <style>
    .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .subtitle { font: 18px Arial, Helvetica, sans-serif; fill: #dbeafe; }
    .section { font: 700 26px Arial, Helvetica, sans-serif; fill: #0b3a67; }
    .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #102a43; }
    .body { font: 21px Arial, Helvetica, sans-serif; fill: #243b53; }
    .small { font: 18px Arial, Helvetica, sans-serif; fill: #334e68; }
    .toe { fill: #f7fbff; stroke: #087e8b; stroke-width: 3; stroke-dasharray: 12 8; }
    .component { fill: #d9f1f5; stroke: #087e8b; stroke-width: 3; }
    .instance { fill: #f0fbfd; stroke: #087e8b; stroke-width: 2; }
    .mapping { fill: none; stroke: #087e8b; stroke-width: 3; }
    .relation { fill: none; stroke: #0b3a67; stroke-width: 3; }
    .dependency { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 6 5; }
    .oe { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .callout { fill: #fff8e7; stroke: #a86600; stroke-width: 2; }
  </style>

  <rect width="1400" height="800" fill="#ffffff"/>
  <rect width="1400" height="80" fill="#0b3a67"/>
  <text x="36" y="37" class="title">Illustrative distributed TOE boundary and evaluation mapping</text>
  <text x="36" y="65" class="subtitle">Explanatory only: normative text, SFR allocations, and Evaluation Activities control.</text>

  <rect x="28" y="108" width="958" height="650" rx="18" class="toe"/>
  <text x="55" y="143" class="section">TOE boundary</text>
  <text x="55" y="171" class="body"><tspan x="55">Logical TOE Components map to claims.</tspan><tspan x="55" dy="27">Their deployed occurrences are TOE Component Instances.</tspan></text>

  <rect x="55" y="218" width="272" height="114" rx="13" class="component"/>
  <text x="191" y="253" class="label" text-anchor="middle">TOE Component A</text>
  <text x="191" y="282" class="body" text-anchor="middle">application payload</text>
  <text x="191" y="309" class="small" text-anchor="middle">allocated SFR elements</text>
  <path d="M191 332 V350 M119 350 H263 M119 350 V370 M263 350 V370" class="mapping"/>
  <rect x="59" y="370" width="120" height="65" rx="9" class="instance"/>
  <rect x="203" y="370" width="120" height="65" rx="9" class="instance"/>
  <text x="119" y="396" class="small" text-anchor="middle"><tspan x="119">Instance</tspan><tspan x="119" dy="25" class="label">A-1</tspan></text>
  <text x="263" y="396" class="small" text-anchor="middle"><tspan x="263">Instance</tspan><tspan x="263" dy="25" class="label">A-n</tspan></text>

  <rect x="367" y="218" width="272" height="114" rx="13" class="component"/>
  <text x="503" y="253" class="label" text-anchor="middle">TOE Component B</text>
  <text x="503" y="282" class="body" text-anchor="middle">application payload</text>
  <text x="503" y="309" class="small" text-anchor="middle">allocated SFR elements</text>
  <path d="M503 332 V350 M431 350 H575 M431 350 V370 M575 350 V370" class="mapping"/>
  <rect x="371" y="370" width="120" height="65" rx="9" class="instance"/>
  <rect x="515" y="370" width="120" height="65" rx="9" class="instance"/>
  <text x="431" y="396" class="small" text-anchor="middle"><tspan x="431">Instance</tspan><tspan x="431" dy="25" class="label">B-1</tspan></text>
  <text x="575" y="396" class="small" text-anchor="middle"><tspan x="575">Instance</tspan><tspan x="575" dy="25" class="label">B-n</tspan></text>

  <rect x="679" y="218" width="272" height="114" rx="13" class="component"/>
  <text x="815" y="253" class="label" text-anchor="middle">TOE Component C</text>
  <text x="815" y="282" class="body" text-anchor="middle">TOE-provided support</text>
  <text x="815" y="309" class="small" text-anchor="middle">sidecar, helper, or library</text>
  <path d="M815 332 V370" class="mapping"/>
  <rect x="755" y="370" width="120" height="65" rx="9" class="instance"/>
  <text x="815" y="396" class="small" text-anchor="middle"><tspan x="815">Instance</tspan><tspan x="815" dy="25" class="label">C-1</tspan></text>

  <line x1="327" y1="282" x2="367" y2="282" class="relation"/>
  <text x="347" y="267" class="small" text-anchor="middle" style="font-weight:700; fill:#0b3a67">R1</text>
  <line x1="639" y1="282" x2="679" y2="282" class="relation"/>
  <text x="659" y="267" class="small" text-anchor="middle" style="font-weight:700; fill:#0b3a67">R2</text>
  <text x="55" y="466" class="body"><tspan x="55">A-1 … A-n (or B-1 … B-n) are Runtime Replicas only when</tspan><tspan x="55" dy="27">claimed behavior and relevant configuration are the same.</tspan></text>
  <text x="815" y="466" class="small" text-anchor="middle"><tspan x="815">Supports a claimed SFR:</tspan><tspan x="815" dy="27">remains inside the TOE</tspan></text>
  <text x="55" y="522" class="small">R1 / R2 identify relationship types, not individual runtime connections.</text>

  <rect x="55" y="542" width="896" height="192" rx="13" class="callout"/>
  <text x="79" y="576" class="label">Required mapping and retained coverage</text>
  <text x="79" y="605" class="body">The ST allocates each claimed SFR element to responsible logical components.</text>
  <text x="79" y="633" class="body">Replica count alone does not change allocation.</text>
  <text x="79" y="661" class="body"><tspan x="79">Retain coverage of interfaces, channels, configurations, artifacts,</tspan><tspan x="79" dy="27">and end-to-end behavior at the stated Evaluation Activity scope.</tspan></text>
  <text x="79" y="716" class="small">Delivered TSF support stays inside the TOE, including sidecars and helpers.</text>

  <rect x="1020" y="108" width="352" height="650" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="1042" y="143" class="section"><tspan x="1042">Operational</tspan><tspan x="1042" dy="28">environment</tspan></text>
  <text x="1042" y="200" class="small"><tspan x="1042">Boundary classification is not</tspan><tspan x="1042" dy="23">a trust conclusion.</tspan></text>

  <rect x="1042" y="240" width="308" height="96" rx="11" class="oe"/>
  <text x="1196" y="270" class="label" text-anchor="middle"><tspan x="1196">Container runtime</tspan><tspan x="1196" dy="27">and host kernel</tspan></text>
  <text x="1196" y="323" class="small" text-anchor="middle">execution and isolation</text>
  <rect x="1042" y="348" width="308" height="96" rx="11" class="oe"/>
  <text x="1196" y="378" class="label" text-anchor="middle"><tspan x="1196">Orchestrator, mesh,</tspan><tspan x="1196" dy="27">and ingress</tspan></text>
  <text x="1196" y="431" class="small" text-anchor="middle">platform and network services</text>
  <rect x="1042" y="456" width="308" height="96" rx="11" class="oe"/>
  <text x="1196" y="486" class="label" text-anchor="middle"><tspan x="1196">Secret or</tspan><tspan x="1196" dy="27">configuration store</tspan></text>
  <text x="1196" y="539" class="small" text-anchor="middle">source and attachment</text>
  <rect x="1042" y="564" width="308" height="96" rx="11" class="oe"/>
  <text x="1196" y="594" class="label" text-anchor="middle"><tspan x="1196">Registry or</tspan><tspan x="1196" dy="27">update service</tspan></text>
  <text x="1196" y="647" class="small" text-anchor="middle">authorized source and delivery</text>
  <text x="1042" y="686" class="small"><tspan x="1042">Document dependencies,</tspan><tspan x="1042" dy="21">configuration, and failure behavior.</tspan><tspan x="1042" dy="21">Use OE functions only where</tspan><tspan x="1042" dy="21">the applicable SFR permits.</tspan></text>

  <line x1="986" y1="498" x2="1020" y2="498" class="dependency"/>
  <line x1="36" y1="783" x2="82" y2="783" class="relation"/>
  <text x="95" y="789" class="small">Relationship: no direction implied</text>
  <line x1="542" y1="783" x2="588" y2="783" class="dependency"/>
  <text x="601" y="789" class="small">TOE-to-OE dependency: no traffic direction or trust implied</text>
</svg>
