<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative component implementation equivalence and retained coverage</title>
  <desc id="desc">An explanatory diagram showing that substantiated implementation equivalence permits representative execution only for identified implementation-specific activity portions while artifacts, interfaces, channels, configurations, and end-to-end behavior remain separately covered.</desc>
  <style>
    .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .subtitle { font: 17px Arial, Helvetica, sans-serif; fill: #dbeafe; }
    .section { font: 700 20px Arial, Helvetica, sans-serif; fill: #102a43; }
    .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #102a43; }
    .body { font: 18px Arial, Helvetica, sans-serif; fill: #243b53; }
    .small { font: 16px Arial, Helvetica, sans-serif; fill: #334e68; }
    .instance { fill: #eaf4f8; stroke: #087e8b; stroke-width: 2; }
    .class { fill: #eef4ff; stroke: #0b3a67; stroke-width: 3; stroke-dasharray: 9 6; }
    .execution { fill: #e9f7ef; stroke: #287d52; stroke-width: 3; }
    .retained { fill: #fff8e7; stroke: #a86600; stroke-width: 2; }
    .guard { fill: #fdecea; stroke: #b42318; stroke-width: 2; }
    .arrow { fill: none; stroke: #0b3a67; stroke-width: 3; }
  </style>

  <rect width="1400" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="1400" height="80" fill="#0b3a67"/>
  <text x="48" y="37" class="title">Illustrative evidence reuse with complete retained coverage</text>
  <text x="48" y="64" class="subtitle">Explanatory only: representative execution is not sampling and does not reduce Evaluation Activity coverage.</text>

  <text x="46" y="119" class="section">1. Name SFR Implementation Instances</text>
  <rect x="46" y="153" width="275" height="86" rx="12" class="instance"/>
  <text x="184" y="185" class="label" text-anchor="middle">Component A, configuration X</text>
  <text x="184" y="214" class="small" text-anchor="middle">SFR Implementation Instance A</text>
  <rect x="46" y="264" width="275" height="86" rx="12" class="instance"/>
  <text x="184" y="296" class="label" text-anchor="middle">Component B, configuration X</text>
  <text x="184" y="325" class="small" text-anchor="middle">SFR Implementation Instance B</text>
  <rect x="46" y="375" width="275" height="86" rx="12" class="instance"/>
  <text x="184" y="407" class="label" text-anchor="middle">Component A, replica A-n</text>
  <text x="184" y="436" class="small" text-anchor="middle">additional deployed occurrence only</text>
  <text x="46" y="499" class="body">A Runtime Replica is not a separate class member merely because it is an added occurrence.</text>

  <path d="M321 245 L390 245" class="arrow"/>
  <polygon points="390,245 372,234 372,256" fill="#0b3a67"/>

  <text x="390" y="119" class="section">2. Substantiate class membership</text>
  <rect x="390" y="153" width="431" height="348" rx="15" class="class"/>
  <text x="606" y="188" class="label" text-anchor="middle">Component Implementation-Equivalence Class</text>
  <text x="420" y="227" class="body">Same security-relevant implementation and version</text>
  <text x="420" y="258" class="body">Same wrapper/integration behavior and exercised code path</text>
  <text x="420" y="289" class="body">Same relevant build options and configuration values</text>
  <text x="420" y="320" class="body">Same provider, role, platform service, and interface</text>
  <text x="420" y="351" class="body">Peripheral differences identified and shown not to affect scope</text>
  <line x1="420" y1="379" x2="791" y2="379" stroke="#829ab1" stroke-width="2"/>
  <text x="420" y="413" class="small">Evidence for every member: artifacts or hashes, dependency manifests,</text>
  <text x="420" y="438" class="small">build and configuration records, and observed invocation paths.</text>
  <text x="420" y="474" class="small">If the prerequisites are not substantiated, representative execution is not available.</text>

  <path d="M821 245 L877 245" class="arrow"/>
  <polygon points="877,245 859,234 859,256" fill="#0b3a67"/>

  <text x="877" y="119" class="section">3. Reuse identified implementation-specific activity</text>
  <rect x="877" y="153" width="477" height="172" rx="15" class="execution"/>
  <text x="1115" y="188" class="label" text-anchor="middle">Representative execution</text>
  <text x="1115" y="219" class="body" text-anchor="middle">Exercise one or more exact deployed Component Instances</text>
  <text x="1115" y="247" class="body" text-anchor="middle">for the expressly identified implementation-specific EA portions.</text>
  <text x="1115" y="282" class="small" text-anchor="middle">Preserve the class mapping, membership evidence, and a separate verdict for each applicable requirement.</text>

  <text x="877" y="362" class="section">Retained coverage at the stated EA scope</text>
  <rect x="877" y="397" width="225" height="94" rx="11" class="retained"/>
  <rect x="1129" y="397" width="225" height="94" rx="11" class="retained"/>
  <rect x="877" y="518" width="225" height="94" rx="11" class="retained"/>
  <rect x="1129" y="518" width="225" height="94" rx="11" class="retained"/>
  <text x="990" y="425" class="label" text-anchor="middle">Artifacts / updates</text>
  <text x="990" y="453" class="small" text-anchor="middle">identity, delivery, verification</text>
  <text x="1242" y="425" class="label" text-anchor="middle">Interfaces / channels</text>
  <text x="1242" y="453" class="small" text-anchor="middle">trust, identity, traffic, recovery</text>
  <text x="990" y="546" class="label" text-anchor="middle">Configuration / deployment</text>
  <text x="990" y="574" class="small" text-anchor="middle">platform and topology differences</text>
  <text x="1242" y="546" class="label" text-anchor="middle">End-to-end behavior</text>
  <text x="1242" y="574" class="small" text-anchor="middle">integration and required testing</text>

  <rect x="46" y="652" width="1308" height="72" rx="12" class="guard"/>
  <text x="76" y="684" class="label">Guardrail:</text>
  <text x="194" y="684" class="body">Class membership does not transfer compliance or remove a Component from the TOE boundary.</text>
  <text x="76" y="710" class="small">Representative execution removes only duplicate implementation-specific activity; other stated coverage remains.</text>
</svg>
