<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">FCO CPC communication-pairing lifecycle</title>
  <desc id="desc">An explanatory lifecycle with three administrative steps: the Security Administrator enables a pairing and endpoint identity set; registration uses either a protected FTP_DIT_EXT.1 channel or out-of-band manual registration; and the enabled pairing permits communication. The administrative permission object is distinct from realized communication between the represented TOE Component Instances. Each endpoint can identify one managed instance or a set sharing a TOE Component identity, including Runtime Replicas. Later disabling the pairing or an endpoint identity blocks all communication authorized solely by that pairing; independently enabled pairings retain their own treatment.</desc>
  <defs>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a86600"/></marker>
    <marker id="arrow-navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0b3a67"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243b53; }
    .title { font-size: 28px; font-weight: 700; fill: #fff; }
    .subtitle { font-size: 21px; fill: #e5edf5; }
    .heading { font-size: 24px; font-weight: 700; fill: #102a43; }
    .body { font-size: 21px; }
    .small { font-size: 18px; }
    .option { font-size: 21px; font-weight: 700; }
    .step { fill: none; stroke: #a86600; stroke-width: 3; marker-end: url(#arrow-amber); }
  </style>
  <rect width="1200" height="840" fill="#fff"/>
  <rect x="30" y="24" width="1140" height="90" rx="14" fill="#0b3a67"/>
  <text x="55" y="60" class="title">FCO_CPC_EXT.1 communication-pairing lifecycle</text>
  <text x="55" y="91" class="subtitle">Administrative permission and realized instance communication are different objects.</text>

  <rect x="35" y="134" width="1130" height="264" rx="16" fill="#fff6dd" stroke="#a86600" stroke-width="3"/>
  <text x="55" y="166" class="heading">Administrative control - FCO_CPC_EXT.1</text>
  <rect x="55" y="186" width="300" height="200" rx="12" fill="#fff" stroke="#a86600" stroke-width="2"/>
  <text x="75" y="217" class="heading">1  Enable pairing</text>
  <text x="75" y="251" class="body"><tspan x="75">Security Administrator</tspan><tspan x="75" dy="27">authorizes the pairing</tspan><tspan x="75" dy="27">and endpoint identity set.</tspan></text>
  <text x="75" y="342" class="small"><tspan x="75">Maps relationship type(s)</tspan><tspan x="75" dy="23">and endpoint identity model(s).</tspan></text>
  <path d="M355 284 H390" class="step"/>

  <rect x="395" y="186" width="405" height="200" rx="12" fill="#fff" stroke="#a86600" stroke-width="2"/>
  <text x="415" y="217" class="heading">2  Select registration</text>
  <rect x="410" y="230" width="375" height="65" rx="8" fill="#e1f3f6" stroke="#087e8b" stroke-width="2"/>
  <text x="597" y="255" class="option" text-anchor="middle">Protected FTP_DIT_EXT.1 channel</text>
  <text x="597" y="280" class="small" text-anchor="middle">May cross an untrusted network</text>
  <text x="597" y="318" class="option" text-anchor="middle">OR</text>
  <rect x="410" y="326" width="375" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="597" y="348" class="option" text-anchor="middle">Out-of-band manual registration</text>
  <text x="597" y="370" class="small" text-anchor="middle">No registration channel selected</text>
  <path d="M800 284 H835" class="step"/>

  <rect x="840" y="186" width="305" height="200" rx="12" fill="#fff" stroke="#a86600" stroke-width="2"/>
  <text x="860" y="217" class="heading">3  Pairing enabled</text>
  <text x="860" y="251" class="body"><tspan x="860">Represented instances</tspan><tspan x="860" dy="27">may establish</tspan><tspan x="860" dy="27">permitted communication.</tspan></text>
  <text x="860" y="351" class="small">Only while enabled.</text>

  <path d="M992 398 V434" fill="none" stroke="#0b3a67" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow-navy)"/>
  <text x="972" y="424" class="small" text-anchor="end">governs permission</text>
  <rect x="35" y="439" width="1130" height="202" rx="16" fill="#edf7f8" stroke="#087e8b" stroke-width="3"/>
  <text x="55" y="471" class="heading">Realized communication - distinct from the administrative pairing</text>
  <path d="M340 539 H380 M820 539 H860" fill="none" stroke="#087e8b" stroke-width="4"/>
  <rect x="55" y="488" width="285" height="91" rx="10" fill="#fff" stroke="#087e8b" stroke-width="2"/>
  <text x="197" y="516" class="heading" text-anchor="middle">Endpoint identity A</text>
  <text x="197" y="543" class="body" text-anchor="middle"><tspan x="197">represented TOE</tspan><tspan x="197" dy="26">Component Instances</tspan></text>
  <rect x="380" y="488" width="440" height="91" rx="10" fill="#e9f7ef" stroke="#287d52" stroke-width="2"/>
  <text x="600" y="517" class="heading" text-anchor="middle">Permitted communication</text>
  <text x="600" y="544" class="body" text-anchor="middle">between the represented instances</text>
  <text x="600" y="569" class="small" text-anchor="middle">Not the pairing control object</text>
  <rect x="860" y="488" width="285" height="91" rx="10" fill="#fff" stroke="#087e8b" stroke-width="2"/>
  <text x="1002" y="516" class="heading" text-anchor="middle">Endpoint identity B</text>
  <text x="1002" y="543" class="body" text-anchor="middle"><tspan x="1002">represented TOE</tspan><tspan x="1002" dy="26">Component Instances</tspan></text>
  <text x="600" y="609" class="small" text-anchor="middle">Each endpoint identifies one managed instance, or a set sharing a TOE Component identity</text>
  <text x="600" y="631" class="small" text-anchor="middle">(including Runtime Replicas).</text>

  <rect x="55" y="663" width="400" height="125" rx="12" fill="#fff6dd" stroke="#a86600" stroke-width="2"/>
  <text x="75" y="694" class="heading">4  Later: disable</text>
  <text x="75" y="720" class="small"><tspan x="75">Security Administrator disables the pairing</tspan><tspan x="75" dy="25">or an endpoint identity so the pairing can</tspan><tspan x="75" dy="25">no longer authorize communication.</tspan></text>
  <path d="M455 724 H507" fill="none" stroke="#0b3a67" stroke-width="3"/>
  <circle cx="481" cy="724" r="13" fill="#fff" stroke="#0b3a67" stroke-width="3"/>
  <path d="M472 733 L490 715" stroke="#0b3a67" stroke-width="3"/>
  <rect x="510" y="663" width="635" height="125" rx="12" fill="#f1f5f9" stroke="#0b3a67" stroke-width="2"/>
  <text x="530" y="694" class="heading">Solely authorized communication is blocked</text>
  <text x="530" y="721" class="body"><tspan x="530">Prevent all communication authorized solely by that pairing.</tspan><tspan x="530" dy="26">Independently enabled pairings are evaluated</tspan><tspan x="530" dy="26">on their own terms.</tspan></text>
  <text x="600" y="822" class="small" text-anchor="middle">Explanatory; normative text and Evaluation Activities control.</text>
</svg>
