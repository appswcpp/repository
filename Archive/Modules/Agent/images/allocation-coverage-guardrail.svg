<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Distributed TOE allocation and evaluation-coverage guardrail</title>
  <desc id="desc">An explanatory flow from the SFR claim condition through All Components, At Least One Component, or Feature Dependent allocation to element-level ST mapping and required Evaluation Activity coverage. Only after allocation and coverage are identified can substantiated implementation equivalence permit reuse of an implementation-specific activity paragraph or test portion. Reuse eliminates only duplicate execution of that scoped activity, not allocation or required artifact, configuration, interface, channel, relationship, topology, deployment, and end-to-end coverage.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0b3a67"/></marker></defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243b53; }
    .title { font-size: 28px; font-weight: 700; fill: #fff; }
    .subtitle { font-size: 21px; fill: #e5edf5; }
    .heading { font-size: 24px; font-weight: 700; fill: #102a43; }
    .label { font-size: 22px; font-weight: 700; fill: #102a43; }
    .body { font-size: 21px; }
    .small { font-size: 18px; }
    .flow { fill: none; stroke: #0b3a67; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="900" fill="#fff"/>
  <rect x="30" y="24" width="1140" height="90" rx="14" fill="#0b3a67"/>
  <text x="55" y="60" class="title">Distributed TOE allocation &amp; coverage guardrail</text>
  <text x="55" y="91" class="subtitle">Identify the claim, responsibility, and required coverage before considering evidence reuse.</text>

  <rect x="40" y="140" width="270" height="236" rx="12" fill="#fff6dd" stroke="#a86600" stroke-width="2"/>
  <text x="60" y="175" class="heading">1  Claim condition</text>
  <text x="60" y="214" class="body"><tspan x="60">Does a selection,</tspan><tspan x="60" dy="28">feature, or objective</tspan><tspan x="60" dy="28">claim the SFR?</tspan></text>
  <text x="60" y="321" class="small"><tspan x="60">Determines whether the</tspan><tspan x="60" dy="24">SFR is included.</tspan></text>
  <path d="M310 250 H340" class="flow"/>

  <rect x="345" y="140" width="410" height="236" rx="12" fill="#edf7f8" stroke="#087e8b" stroke-width="2"/>
  <text x="365" y="175" class="heading">2  Allocate responsibility</text>
  <text x="365" y="211" class="label">All Components</text>
  <text x="365" y="235" class="small">Each TOE Component</text>
  <text x="365" y="268" class="label">At Least One Component</text>
  <text x="365" y="292" class="small">Only where expressly permitted</text>
  <text x="365" y="325" class="label">Feature Dependent</text>
  <text x="365" y="347" class="small">Each Component implementing the feature</text>
  <text x="365" y="369" class="small">or allocated SFR element</text>
  <path d="M755 250 H785" class="flow"/>

  <rect x="790" y="140" width="370" height="236" rx="12" fill="#edf7f8" stroke="#087e8b" stroke-width="2"/>
  <text x="810" y="175" class="heading">3  Map in the ST</text>
  <text x="810" y="212" class="body"><tspan x="810">For each allocated SFR element:</tspan><tspan x="810" dy="28">Component(s), artifact,</tspan><tspan x="810" dy="28">configuration, interface / path,</tspan><tspan x="810" dy="28">and iteration.</tspan></text>
  <text x="810" y="343" class="small">OE only where expressly allowed.</text>
  <path d="M975 376 V395" class="flow"/>

  <rect x="40" y="400" width="1120" height="210" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="432" class="heading">4  Identify required Evaluation Activity coverage</text>
  <text x="60" y="461" class="body">Every allocated Component exhibits the claimed behavior in its identified configuration.</text>
  <text x="60" y="485" class="small">Deployment multiplicity does not let one instance satisfy another's obligation.</text>
  <g fill="#fff" stroke="#64748b" stroke-width="1.5">
    <rect x="60" y="501" width="195" height="80" rx="8"/><rect x="270" y="501" width="190" height="80" rx="8"/>
    <rect x="475" y="501" width="210" height="80" rx="8"/><rect x="700" y="501" width="235" height="80" rx="8"/>
    <rect x="950" y="501" width="190" height="80" rx="8"/>
  </g>
  <text x="157" y="527" class="label" text-anchor="middle">TOE Component</text>
  <text x="157" y="550" class="small" text-anchor="middle"><tspan x="157">Allocated SFR</tspan><tspan x="157" dy="22">element</tspan></text>
  <text x="365" y="527" class="label" text-anchor="middle">Artifact</text>
  <text x="365" y="550" class="small" text-anchor="middle"><tspan x="365">Lifecycle /</tspan><tspan x="365" dy="22">implementation</tspan></text>
  <text x="580" y="527" class="label" text-anchor="middle">Configuration</text>
  <text x="580" y="558" class="small" text-anchor="middle">Deployed context</text>
  <text x="817" y="527" class="label" text-anchor="middle">Interface / channel</text>
  <text x="817" y="550" class="small" text-anchor="middle"><tspan x="817">Communication</tspan><tspan x="817" dy="22">relationship</tspan></text>
  <text x="1045" y="527" class="label" text-anchor="middle">Integration</text>
  <text x="1045" y="550" class="small" text-anchor="middle"><tspan x="1045">End-to-end</tspan><tspan x="1045" dy="22">behavior</tspan></text>
  <text x="600" y="601" class="small" text-anchor="middle">Allocation and coverage identification must be complete before any reuse decision.</text>

  <text x="40" y="642" class="heading">Only then: consider scoped evidence reuse</text>
  <rect x="40" y="660" width="330" height="192" rx="12" fill="#fff6dd" stroke="#a86600" stroke-width="2"/>
  <text x="60" y="691" class="heading">Substantiate equivalence</text>
  <text x="60" y="724" class="body"><tspan x="60">Scoped implementation</tspan><tspan x="60" dy="27">and execution context:</tspan></text>
  <text x="60" y="776" class="small"><tspan x="60">same security-relevant</tspan><tspan x="60" dy="22">implementation + version;</tspan><tspan x="60" dy="22">configuration; role / code path;</tspan><tspan x="60" dy="22">services and interfaces.</tspan></text>
  <path d="M370 756 H420" class="flow"/>

  <rect x="425" y="660" width="340" height="192" rx="12" fill="#e9f7ef" stroke="#287d52" stroke-width="2"/>
  <text x="445" y="691" class="heading"><tspan x="445">Reuse scoped</tspan><tspan x="445" dy="28">execution only</tspan></text>
  <text x="445" y="751" class="body"><tspan x="445">Only a substantiated</tspan><tspan x="445" dy="27">implementation-specific EA</tspan><tspan x="445" dy="27">paragraph or test portion.</tspan></text>
  <text x="445" y="836" class="small">Eliminates duplicate execution only.</text>

  <rect x="800" y="660" width="360" height="192" rx="12" fill="#fff6dd" stroke="#a86600" stroke-width="3"/>
  <text x="820" y="691" class="heading">Coverage remains</text>
  <text x="820" y="724" class="body"><tspan x="820">No change to allocation</tspan><tspan x="820" dy="27">or required coverage.</tspan></text>
  <text x="820" y="788" class="small"><tspan x="820">Artifacts • configurations • interfaces</tspan><tspan x="820" dy="23">Channels • relationships • topology</tspan><tspan x="820" dy="23">Deployment • end-to-end behavior</tspan></text>
  <text x="600" y="884" class="small" text-anchor="middle">Explanatory; normative text, allocation tables, and Evaluation Activities control.</text>
</svg>
