<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative five-component twelve-container TOE topology</title>
  <desc id="desc">An explanatory, non-normative topology with five TOE Components and twelve deployed instances inside the TOE boundary. Server and Agent role badges show roles, not network direction. Seven relationship-type lines R1 through R7 are shown once each, while operational-environment services remain outside the TOE boundary.</desc>
  <style>
    .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #d9e2ec; }
    .boundary-label { font: 700 19px Arial, Helvetica, sans-serif; fill: #0b3a67; }
    .card-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #102a43; }
    .body { font: 17px Arial, Helvetica, sans-serif; fill: #243b53; }
    .small { font: 15px Arial, Helvetica, sans-serif; fill: #334e68; }
    .tiny { font: 14px Arial, Helvetica, sans-serif; fill: #334e68; }
    .badge { font: 700 14px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .instance { font: 700 14px Arial, Helvetica, sans-serif; fill: #243b53; }
    .rel { font: 700 14px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .legend-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #102a43; }
    .legend { font: 14px Arial, Helvetica, sans-serif; fill: #334e68; }
  </style>

  <rect width="1400" height="1080" fill="#ffffff"/>
  <rect x="30" y="24" width="1340" height="78" rx="14" fill="#0b3a67"/>
  <text x="60" y="57" class="title">Illustrative five-component / twelve-container topology</text>
  <text x="60" y="83" class="subtitle">Roles classify component responsibilities; they do not show client/server direction, hosting, or communication initiation.</text>

  <!-- TOE boundary -->
  <rect x="35" y="128" width="1330" height="560" rx="18" fill="#f7fafc" stroke="#486581" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="65" y="161" class="boundary-label">TOE boundary — five TOE Components / twelve deployed TOE Component Instances</text>
  <text x="65" y="185" class="small">Relationship lines represent one Communication Relationship Type each; they do not enumerate every Runtime Replica connection.</text>

  <!-- Relationship type lines: deliberately no arrowheads -->
  <g fill="none" stroke="#0b3a67" stroke-width="4">
    <line x1="405" y1="505" x2="590" y2="375"/>
    <line x1="1015" y1="515" x2="810" y2="374"/>
    <line x1="810" y1="302" x2="1040" y2="258"/>
    <line x1="700" y1="490" x2="700" y2="405"/>
    <polyline points="810,542 930,542 930,302 1040,302"/>
    <line x1="590" y1="560" x2="405" y2="550"/>
    <line x1="810" y1="560" x2="1015" y2="550"/>
  </g>

  <!-- Relationship labels -->
  <g>
    <circle cx="498" cy="430" r="18" fill="#a86600"/><text x="498" y="435" class="rel" text-anchor="middle">R1</text>
    <circle cx="912" cy="431" r="18" fill="#a86600"/><text x="912" y="436" class="rel" text-anchor="middle">R2</text>
    <circle cx="926" cy="270" r="18" fill="#a86600"/><text x="926" y="275" class="rel" text-anchor="middle">R3</text>
    <circle cx="723" cy="448" r="18" fill="#a86600"/><text x="723" y="453" class="rel" text-anchor="middle">R4</text>
    <circle cx="952" cy="412" r="18" fill="#a86600"/><text x="952" y="417" class="rel" text-anchor="middle">R5</text>
    <circle cx="500" cy="555" r="18" fill="#a86600"/><text x="500" y="560" class="rel" text-anchor="middle">R6</text>
    <circle cx="912" cy="555" r="18" fill="#a86600"/><text x="912" y="560" class="rel" text-anchor="middle">R7</text>
  </g>

  <!-- Management API: Server + Agent, 2 instances -->
  <g>
    <rect x="590" y="270" width="220" height="135" rx="13" fill="#e1f3f6" stroke="#087e8b" stroke-width="3"/>
    <text x="610" y="301" class="card-title">Management API</text>
    <rect x="610" y="315" width="63" height="24" rx="6" fill="#087e8b"/><text x="641" y="332" class="badge" text-anchor="middle">Server</text>
    <rect x="679" y="315" width="55" height="24" rx="6" fill="#a86600"/><text x="706" y="332" class="badge" text-anchor="middle">Agent</text>
    <rect x="610" y="354" width="84" height="32" rx="6" fill="#ffffff" stroke="#087e8b" stroke-width="2"/>
    <rect x="705" y="354" width="84" height="32" rx="6" fill="#ffffff" stroke="#087e8b" stroke-width="2"/>
    <text x="652" y="376" class="instance" text-anchor="middle">M-1</text><text x="747" y="376" class="instance" text-anchor="middle">M-2</text>
  </g>

  <!-- Policy Service: Server + Agent, 2 instances -->
  <g>
    <rect x="1040" y="190" width="240" height="135" rx="13" fill="#e1f3f6" stroke="#087e8b" stroke-width="3"/>
    <text x="1060" y="221" class="card-title">Policy Service</text>
    <rect x="1060" y="235" width="63" height="24" rx="6" fill="#087e8b"/><text x="1091" y="252" class="badge" text-anchor="middle">Server</text>
    <rect x="1129" y="235" width="55" height="24" rx="6" fill="#a86600"/><text x="1156" y="252" class="badge" text-anchor="middle">Agent</text>
    <rect x="1060" y="274" width="92" height="32" rx="6" fill="#ffffff" stroke="#087e8b" stroke-width="2"/>
    <rect x="1164" y="274" width="92" height="32" rx="6" fill="#ffffff" stroke="#087e8b" stroke-width="2"/>
    <text x="1106" y="296" class="instance" text-anchor="middle">P-1</text><text x="1210" y="296" class="instance" text-anchor="middle">P-2</text>
  </g>

  <!-- Worker: Agent, 4 instances -->
  <g>
    <rect x="105" y="460" width="300" height="150" rx="13" fill="#fff0dd" stroke="#a86600" stroke-width="3"/>
    <text x="125" y="492" class="card-title">Worker</text>
    <rect x="125" y="505" width="55" height="24" rx="6" fill="#a86600"/><text x="152" y="522" class="badge" text-anchor="middle">Agent</text>
    <rect x="125" y="547" width="57" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <rect x="192" y="547" width="57" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <rect x="259" y="547" width="57" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <rect x="326" y="547" width="57" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <text x="153" y="569" class="instance" text-anchor="middle">W-1</text><text x="220" y="569" class="instance" text-anchor="middle">W-2</text><text x="287" y="569" class="instance" text-anchor="middle">W-3</text><text x="354" y="569" class="instance" text-anchor="middle">W-4</text>
  </g>

  <!-- Telemetry: Agent, 3 instances -->
  <g>
    <rect x="1015" y="470" width="290" height="145" rx="13" fill="#fff0dd" stroke="#a86600" stroke-width="3"/>
    <text x="1035" y="501" class="card-title">Telemetry Agent</text>
    <rect x="1035" y="514" width="55" height="24" rx="6" fill="#a86600"/><text x="1062" y="531" class="badge" text-anchor="middle">Agent</text>
    <rect x="1035" y="552" width="72" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <rect x="1124" y="552" width="72" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <rect x="1213" y="552" width="72" height="32" rx="6" fill="#ffffff" stroke="#a86600" stroke-width="2"/>
    <text x="1071" y="574" class="instance" text-anchor="middle">T-1</text><text x="1160" y="574" class="instance" text-anchor="middle">T-2</text><text x="1249" y="574" class="instance" text-anchor="middle">T-3</text>
  </g>

  <!-- Update Coordinator: Server + Agent, 1 instance -->
  <g>
    <rect x="590" y="490" width="220" height="135" rx="13" fill="#e1f3f6" stroke="#087e8b" stroke-width="3"/>
    <text x="610" y="520" class="card-title">Update Coordinator</text>
    <rect x="610" y="535" width="63" height="24" rx="6" fill="#087e8b"/><text x="641" y="552" class="badge" text-anchor="middle">Server</text>
    <rect x="679" y="535" width="55" height="24" rx="6" fill="#a86600"/><text x="706" y="552" class="badge" text-anchor="middle">Agent</text>
    <rect x="654" y="576" width="92" height="32" rx="6" fill="#ffffff" stroke="#087e8b" stroke-width="2"/>
    <text x="700" y="598" class="instance" text-anchor="middle">U-1</text>
  </g>

  <!-- Operational environment outside TOE -->
  <rect x="35" y="720" width="1330" height="119" rx="15" fill="#f0f4f8" stroke="#829ab1" stroke-width="3"/>
  <text x="65" y="752" class="boundary-label">Operational environment — dependencies are described in the ST; they are not TOE Components</text>
  <rect x="65" y="775" width="292" height="42" rx="8" fill="#ffffff" stroke="#829ab1" stroke-width="2"/>
  <rect x="379" y="775" width="292" height="42" rx="8" fill="#ffffff" stroke="#829ab1" stroke-width="2"/>
  <rect x="693" y="775" width="292" height="42" rx="8" fill="#ffffff" stroke="#829ab1" stroke-width="2"/>
  <rect x="1007" y="775" width="328" height="42" rx="8" fill="#ffffff" stroke="#829ab1" stroke-width="2"/>
  <text x="211" y="802" class="small" text-anchor="middle">Orchestrator / container runtime</text>
  <text x="525" y="802" class="small" text-anchor="middle">Host operating system / kernel</text>
  <text x="839" y="802" class="small" text-anchor="middle">Ingress / cluster networking / service mesh</text>
  <text x="1171" y="802" class="small" text-anchor="middle">Registry / platform secret and configuration stores</text>

  <!-- Relationship legend -->
  <rect x="35" y="870" width="1330" height="150" rx="15" fill="#ffffff" stroke="#829ab1" stroke-width="3"/>
  <text x="65" y="903" class="boundary-label">Communication Relationship Types (shown once; no direction is implied)</text>
  <text x="65" y="932" class="legend-title">R1</text><text x="95" y="932" class="legend">Worker — Management API: registration and protected work</text>
  <text x="65" y="958" class="legend-title">R2</text><text x="95" y="958" class="legend">Telemetry Agent — Management API: registration and protected telemetry</text>
  <text x="65" y="984" class="legend-title">R3</text><text x="95" y="984" class="legend">Management API — Policy Service: protected policy query</text>
  <text x="710" y="932" class="legend-title">R4</text><text x="740" y="932" class="legend">Update Coordinator — Management API: update control</text>
  <text x="710" y="958" class="legend-title">R5</text><text x="740" y="958" class="legend">Update Coordinator — Policy Service: policy update control</text>
  <text x="710" y="984" class="legend-title">R6</text><text x="740" y="984" class="legend">Update Coordinator — Worker: worker update control</text>
  <text x="710" y="1010" class="legend-title">R7</text><text x="740" y="1010" class="legend">Update Coordinator — Telemetry Agent: telemetry update control</text>

  <text x="700" y="1055" class="small" text-anchor="middle">Explanatory, non-normative worked example; normative text, allocation tables, and Evaluation Activities control.</text>
</svg>
