<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative five-component twelve-container TOE topology</title>
  <desc id="desc">An explanatory, non-normative topology with five logical TOE Components and twelve deployed TOE Component Instances inside the TOE boundary. Management API has M-1 and M-2, Policy Service has P-1 and P-2, Worker has W-1 through W-4, Telemetry Agent has T-1 through T-3, and Update Coordinator has U-1. Server and Agent badges identify roles, not hosting or communication direction. Seven undirected Communication Relationship Type lines R1 through R7 are shown once each, not once per Runtime Replica connection. Operational-environment dependencies are outside the TOE boundary and are described in the ST.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243b53; }
    .title { font-size: 34px; font-weight: 700; fill: #fff; }
    .subtitle { font-size: 21px; fill: #e5edf5; }
    .heading { font-size: 24px; font-weight: 700; fill: #102a43; }
    .small { font-size: 18px; }
    .role { font-size: 18px; font-weight: 700; fill: #fff; }
    .instance { font-size: 21px; font-weight: 700; }
    .rel { font-size: 18px; font-weight: 700; fill: #fff; }
    .legend-name { font-size: 18px; font-weight: 700; }
    .relationship { fill: none; stroke: #0b3a67; stroke-width: 4; }
    .component { fill: #e1f3f6; stroke: #087e8b; stroke-width: 3; }
    .chip { fill: #fff; stroke: #087e8b; stroke-width: 2; }
  </style>
  <rect width="1400" height="1080" fill="#fff"/>
  <rect x="30" y="24" width="1340" height="90" rx="14" fill="#0b3a67"/>
  <text x="55" y="63" class="title">5 logical components / 12 deployed instances</text>
  <text x="55" y="94" class="subtitle">Illustrative container topology - roles do not imply hosting, direction, or communication initiation.</text>

  <rect x="35" y="135" width="1330" height="529" rx="16" fill="#f8fafc" stroke="#0b3a67" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="60" y="168" class="heading">TOE boundary</text>
  <text x="60" y="194" class="small">Each line is one Communication Relationship Type, not every Runtime Replica connection.</text>

  <!-- Undirected relationship types: R5 runs around the outer edge, avoiding other routes. -->
  <path d="M490 285 L390 409" class="relationship"/>
  <path d="M820 322 L920 409" class="relationship"/>
  <path d="M820 260 H920" class="relationship"/>
  <path d="M655 357 V460" class="relationship"/>
  <path d="M655 597 V634 H1335 V267 H1305" class="relationship"/>
  <path d="M490 550 L390 488" class="relationship"/>
  <path d="M820 530 L920 488" class="relationship"/>
  <g>
    <circle cx="440" cy="347" r="22" fill="#a86600"/><text x="440" y="353" class="rel" text-anchor="middle">R1</text>
    <circle cx="870" cy="366" r="22" fill="#a86600"/><text x="870" y="372" class="rel" text-anchor="middle">R2</text>
    <circle cx="870" cy="260" r="22" fill="#a86600"/><text x="870" y="266" class="rel" text-anchor="middle">R3</text>
    <circle cx="655" cy="409" r="22" fill="#a86600"/><text x="655" y="415" class="rel" text-anchor="middle">R4</text>
    <circle cx="1125" cy="634" r="22" fill="#a86600"/><text x="1125" y="640" class="rel" text-anchor="middle">R5</text>
    <circle cx="440" cy="519" r="22" fill="#a86600"/><text x="440" y="525" class="rel" text-anchor="middle">R6</text>
    <circle cx="870" cy="509" r="22" fill="#a86600"/><text x="870" y="515" class="rel" text-anchor="middle">R7</text>
  </g>

  <!-- A large card denotes a logical TOE Component; small chips denote deployed instances. -->
  <g>
    <rect x="490" y="220" width="330" height="137" rx="12" class="component"/>
    <text x="510" y="252" class="heading">Management API</text>
    <rect x="510" y="267" width="78" height="26" rx="6" fill="#0b3a67"/><text x="549" y="286" class="role" text-anchor="middle">Server</text>
    <rect x="598" y="267" width="72" height="26" rx="6" fill="#0b3a67"/><text x="634" y="286" class="role" text-anchor="middle">Agent</text>
    <rect x="510" y="308" width="138" height="33" rx="6" class="chip"/><text x="579" y="332" class="instance" text-anchor="middle">M-1</text>
    <rect x="662" y="308" width="138" height="33" rx="6" class="chip"/><text x="731" y="332" class="instance" text-anchor="middle">M-2</text>
  </g>
  <g>
    <rect x="920" y="211" width="385" height="137" rx="12" class="component"/>
    <text x="940" y="243" class="heading">Policy Service</text>
    <rect x="940" y="258" width="78" height="26" rx="6" fill="#0b3a67"/><text x="979" y="277" class="role" text-anchor="middle">Server</text>
    <rect x="1028" y="258" width="72" height="26" rx="6" fill="#0b3a67"/><text x="1064" y="277" class="role" text-anchor="middle">Agent</text>
    <rect x="940" y="299" width="165" height="33" rx="6" class="chip"/><text x="1022" y="323" class="instance" text-anchor="middle">P-1</text>
    <rect x="1120" y="299" width="165" height="33" rx="6" class="chip"/><text x="1202" y="323" class="instance" text-anchor="middle">P-2</text>
  </g>
  <g>
    <rect x="80" y="365" width="310" height="166" rx="12" class="component"/>
    <text x="100" y="397" class="heading">Worker</text>
    <rect x="100" y="412" width="72" height="26" rx="6" fill="#0b3a67"/><text x="136" y="431" class="role" text-anchor="middle">Agent</text>
    <rect x="100" y="463" width="60" height="40" rx="6" class="chip"/><text x="130" y="490" class="instance" text-anchor="middle">W-1</text>
    <rect x="170" y="463" width="60" height="40" rx="6" class="chip"/><text x="200" y="490" class="instance" text-anchor="middle">W-2</text>
    <rect x="240" y="463" width="60" height="40" rx="6" class="chip"/><text x="270" y="490" class="instance" text-anchor="middle">W-3</text>
    <rect x="310" y="463" width="60" height="40" rx="6" class="chip"/><text x="340" y="490" class="instance" text-anchor="middle">W-4</text>
  </g>
  <g>
    <rect x="920" y="380" width="385" height="146" rx="12" class="component"/>
    <text x="940" y="412" class="heading">Telemetry Agent</text>
    <rect x="940" y="427" width="72" height="26" rx="6" fill="#0b3a67"/><text x="976" y="446" class="role" text-anchor="middle">Agent</text>
    <rect x="940" y="468" width="105" height="40" rx="6" class="chip"/><text x="992" y="495" class="instance" text-anchor="middle">T-1</text>
    <rect x="1060" y="468" width="105" height="40" rx="6" class="chip"/><text x="1112" y="495" class="instance" text-anchor="middle">T-2</text>
    <rect x="1180" y="468" width="105" height="40" rx="6" class="chip"/><text x="1232" y="495" class="instance" text-anchor="middle">T-3</text>
  </g>
  <g>
    <rect x="490" y="460" width="330" height="137" rx="12" class="component"/>
    <text x="510" y="492" class="heading">Update Coordinator</text>
    <rect x="510" y="507" width="78" height="26" rx="6" fill="#0b3a67"/><text x="549" y="526" class="role" text-anchor="middle">Server</text>
    <rect x="598" y="507" width="72" height="26" rx="6" fill="#0b3a67"/><text x="634" y="526" class="role" text-anchor="middle">Agent</text>
    <rect x="586" y="548" width="138" height="33" rx="6" class="chip"/><text x="655" y="572" class="instance" text-anchor="middle">U-1</text>
  </g>
  <text x="60" y="569" class="small"><tspan x="60">Large cards: logical TOE Components</tspan><tspan x="60" dy="25">Small chips: deployed instances</tspan></text>

  <rect x="35" y="687" width="1330" height="106" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="719" class="heading">Operational environment - not TOE Components</text>
  <text x="1340" y="718" class="small" text-anchor="end">Dependencies described in the ST</text>
  <g fill="#fff" stroke="#64748b" stroke-width="1.5">
    <rect x="60" y="734" width="290" height="47" rx="7"/><rect x="366" y="734" width="290" height="47" rx="7"/>
    <rect x="672" y="734" width="310" height="47" rx="7"/><rect x="998" y="734" width="342" height="47" rx="7"/>
  </g>
  <text x="205" y="753" class="small" text-anchor="middle"><tspan x="205">Orchestrator /</tspan><tspan x="205" dy="22">container runtime</tspan></text>
  <text x="511" y="753" class="small" text-anchor="middle"><tspan x="511">Host operating system /</tspan><tspan x="511" dy="22">kernel</tspan></text>
  <text x="827" y="753" class="small" text-anchor="middle"><tspan x="827">Ingress / cluster networking /</tspan><tspan x="827" dy="22">service mesh</tspan></text>
  <text x="1169" y="753" class="small" text-anchor="middle"><tspan x="1169">Registry / platform secret</tspan><tspan x="1169" dy="22">and configuration stores</tspan></text>

  <rect x="35" y="815" width="1330" height="220" rx="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="846" class="heading">Communication Relationship Types - each shown once; no direction implied</text>
  <g class="legend-name">
    <text x="60" y="879">R1</text><text x="104" y="879">Worker - Management API</text>
    <text x="60" y="937">R2</text><text x="104" y="937">Telemetry Agent - Management API</text>
    <text x="60" y="995">R3</text><text x="104" y="995">Management API - Policy Service</text>
    <text x="730" y="879">R4</text><text x="774" y="879">Update Coordinator - Management API</text>
    <text x="730" y="921">R5</text><text x="774" y="921">Update Coordinator - Policy Service</text>
    <text x="730" y="963">R6</text><text x="774" y="963">Update Coordinator - Worker</text>
    <text x="730" y="1005">R7</text><text x="774" y="1005">Update Coordinator - Telemetry Agent</text>
  </g>
  <g class="small">
    <text x="104" y="901">Registration and protected work</text>
    <text x="104" y="959">Registration and protected telemetry</text>
    <text x="104" y="1017">Protected policy query</text>
    <text x="774" y="901">Update control</text>
    <text x="774" y="943">Policy update control</text>
    <text x="774" y="985">Worker update control</text>
    <text x="774" y="1027">Telemetry update control</text>
  </g>
  <text x="700" y="1064" class="small" text-anchor="middle">Explanatory, non-normative worked example; normative text, allocation tables, and Evaluation Activities control.</text>
</svg>
