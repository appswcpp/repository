<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PP-Configuration selection for TOE Components and deployed instances</title>
  <desc id="desc">Decision flow for an Enterprise Server Application TOE. A server-only TOE with one logical TOE Component may use Runtime Replicas. Separately deployed distinct TOE Components are assessed against the Agent Module control model. Arrows show the decision flow rather than communication direction.</desc>
  <defs>
    <marker id="decision-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3a67"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .question { font: 700 26px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .outcome { font: 700 24px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .body { font: 21px Arial, Helvetica, sans-serif; fill: #243b53; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .small-strong { font: 700 19px Arial, Helvetica, sans-serif; fill: #475569; }
      .branch { font: 700 20px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .legend { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #0b3a67; stroke-width: 4; marker-end: url(#decision-arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="260" y="24" width="680" height="90" rx="16" fill="#0b3a67"/>
  <text x="600" y="60" class="heading" text-anchor="middle">
    <tspan x="600" dy="0">Enterprise Server Application TOE</tspan>
    <tspan x="600" dy="30">TOE boundary already identified</tspan>
  </text>

  <path d="M600 114 L600 142" class="line"/>

  <rect x="205" y="150" width="790" height="128" rx="18" fill="#eef8fa" stroke="#087e8b" stroke-width="3"/>
  <text x="600" y="187" class="question" text-anchor="middle">
    <tspan x="600" dy="0">Does the TOE have separately deployed instances of</tspan>
    <tspan x="600" dy="31">more than one distinct TOE Component that collectively</tspan>
    <tspan x="600" dy="31">provide TOE security functionality?</tspan>
  </text>

  <path d="M205 214 L112 214 L112 330" class="line"/>
  <text x="151" y="205" class="branch" text-anchor="middle">NO</text>

  <rect x="28" y="330" width="360" height="190" rx="16" fill="#edf9f1" stroke="#287d52" stroke-width="3"/>
  <text x="208" y="368" class="outcome" text-anchor="middle">Server-only may apply</text>
  <text x="208" y="405" class="body" text-anchor="middle">
    <tspan x="208" dy="0">One logical TOE Component</tspan>
    <tspan x="208" dy="26">may have Runtime Replicas.</tspan>
    <tspan x="208" dy="26">Instance count and horizontal</tspan>
    <tspan x="208" dy="26">scaling alone do not trigger</tspan>
    <tspan x="208" dy="26">the Agent Module.</tspan>
  </text>

  <rect x="28" y="540" width="360" height="145" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="208" y="572" class="small-strong" text-anchor="middle">Scope note</text>
  <text x="208" y="607" class="small" text-anchor="middle">
    <tspan x="208" dy="0">This topology decision does not, by itself,</tspan>
    <tspan x="208" dy="24">establish full conformance. All other</tspan>
    <tspan x="208" dy="24">applicability rules still apply.</tspan>
  </text>

  <path d="M600 278 L600 318" class="line"/>
  <text x="626" y="303" class="branch">YES</text>

  <rect x="415" y="318" width="755" height="202" rx="18" fill="#fff8e6" stroke="#a86600" stroke-width="3"/>
  <text x="792" y="356" class="question" text-anchor="middle">
    <tspan x="792" dy="0">Do the component relationships satisfy</tspan>
    <tspan x="792" dy="31">the Agent Module control model?</tspan>
  </text>
  <text x="452" y="428" class="body">
    <tspan x="452" dy="0">• registration using the selected permitted method</tspan>
    <tspan x="452" dy="29">• Security Administrator enablement and disablement</tspan>
    <tspan x="452" dy="29">• applicable communication protection under FTP_DIT_EXT.1</tspan>
  </text>

  <path d="M665 520 L665 550" class="line"/>
  <text x="692" y="557" class="branch">YES</text>

  <path d="M1020 520 L1020 550" class="line"/>
  <text x="1047" y="557" class="branch">NO</text>

  <rect x="405" y="570" width="450" height="150" rx="16" fill="#edf9f1" stroke="#287d52" stroke-width="3"/>
  <text x="630" y="610" class="outcome" text-anchor="middle">
    <tspan x="652" dy="0">Use the Server + Agent</tspan>
    <tspan x="652" dy="29">PP-Configuration</tspan>
  </text>
  <text x="630" y="679" class="small" text-anchor="middle">
    <tspan x="630" dy="0">Map each TOE Component and</tspan>
    <tspan x="630" dy="22">relationship in the ST.</tspan>
  </text>

  <rect x="875" y="570" width="297" height="180" rx="16" fill="#fff8e6" stroke="#a86600" stroke-width="3"/>
  <text x="1023" y="609" class="outcome" text-anchor="middle">
    <tspan x="1023" dy="0">Server-only is not</tspan>
    <tspan x="1023" dy="27">an alternative</tspan>
    <tspan x="1023" dy="27">allocation path</tspan>
  </text>
  <text x="1023" y="690" class="small" text-anchor="middle">
    <tspan x="1023" dy="0">Use another approved</tspan>
    <tspan x="1023" dy="22">PP-Configuration or request</tspan>
    <tspan x="1023" dy="22">AppSW-iTC guidance.</tspan>
  </text>

  <g aria-label="Decision-flow legend">
    <path d="M30 739 L78 739" class="line"/>
    <text x="94" y="745" class="legend">Arrows show decision flow; labels identify the outcome.</text>
  </g>
</svg>
