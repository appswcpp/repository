<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Logical TOE Components and deployed runtime replicas</title>
  <desc id="desc">The left panel shows one logical Server TOE Component with several deployed Runtime Replica instances. The right panel shows distinct logical Server and Agent TOE Components, their deployed instances, and relationship R1 governed by the Agent Module control model. R1 is not a call-direction indicator.</desc>
  <defs>
    <marker id="relationship-dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <circle cx="4" cy="4" r="2.4" fill="#0b3a67"/>
    </marker>
    <style>
      .panel-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .panel-subtitle { font: 700 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .type-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .role { font: 700 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .tile { font: 700 18px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .body { font: 21px Arial, Helvetica, sans-serif; fill: #243b53; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .outcome { font: 700 24px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .outcome-detail { font: 700 21px Arial, Helvetica, sans-serif; fill: #0b3a67; }
      .boundary-label { font: 700 18px Arial, Helvetica, sans-serif; fill: #64748b; }
      .boundary { fill: #ffffff; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; }
      .instance-server { fill: #e6f6f8; stroke: #087e8b; stroke-width: 2.5; }
      .instance-agent { fill: #fff2df; stroke: #a86600; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <rect x="20" y="20" width="560" height="640" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <rect x="20" y="20" width="560" height="80" rx="18" fill="#0b3a67"/>
  <rect x="20" y="82" width="560" height="18" fill="#0b3a67"/>
  <text x="300" y="52" class="panel-title" text-anchor="middle">
    <tspan x="300" dy="0">Server-only topology</tspan>
    <tspan x="300" dy="29" class="panel-subtitle">one TOE Component with Runtime Replicas</tspan>
  </text>

  <rect x="48" y="118" width="504" height="408" rx="14" class="boundary"/>
  <text x="68" y="145" class="boundary-label">TOE boundary</text>
  <text x="532" y="165" class="small" text-anchor="end">Cards = components · tiles = deployed instances</text>

  <rect x="90" y="176" width="420" height="80" rx="14" fill="#c8edf1" stroke="#087e8b" stroke-width="3"/>
  <text x="300" y="210" class="type-title" text-anchor="middle">
    <tspan x="300" dy="0">Logical TOE Component S</tspan>
    <tspan x="300" dy="28">Enterprise Server Application</tspan>
  </text>

  <path d="M300 256 L300 282 M155 282 L445 282 M155 282 L155 294 M300 282 L300 294 M445 282 L445 294" fill="none" stroke="#087e8b" stroke-width="4"/>

  <rect x="95" y="294" width="120" height="72" rx="10" class="instance-server"/>
  <rect x="240" y="294" width="120" height="72" rx="10" class="instance-server"/>
  <rect x="385" y="294" width="120" height="72" rx="10" class="instance-server"/>
  <text x="155" y="324" class="tile" text-anchor="middle"><tspan x="155">Instance</tspan><tspan x="155" dy="22">S-1</tspan></text>
  <text x="300" y="324" class="tile" text-anchor="middle"><tspan x="300">Instance</tspan><tspan x="300" dy="22">S-2</tspan></text>
  <text x="445" y="324" class="tile" text-anchor="middle"><tspan x="445">Instance</tspan><tspan x="445" dy="22">S-n</tspan></text>

  <rect x="68" y="390" width="464" height="108" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="419" class="body" text-anchor="middle">
    <tspan x="300" dy="0">Same artifact, security-relevant configuration,</tspan>
    <tspan x="300" dy="25">role, claimed SFR behavior, and relevant</tspan>
    <tspan x="300" dy="25">platform interface: these are Runtime Replicas</tspan>
  </text>

  <rect x="62" y="545" width="476" height="92" rx="14" fill="#edf9f1" stroke="#287d52" stroke-width="3"/>
  <text x="300" y="574" class="outcome" text-anchor="middle">
    <tspan x="300" dy="0">One logical TOE Component</tspan>
    <tspan x="300" dy="26">Runtime scaling alone does not</tspan>
    <tspan x="300" dy="26">trigger the Agent Module</tspan>
  </text>

  <rect x="620" y="20" width="560" height="640" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <rect x="620" y="20" width="560" height="80" rx="18" fill="#0b3a67"/>
  <rect x="620" y="82" width="560" height="18" fill="#0b3a67"/>
  <text x="900" y="52" class="panel-title" text-anchor="middle">
    <tspan x="900" dy="0">Server + Agent topology</tspan>
    <tspan x="900" dy="29" class="panel-subtitle">distinct TOE Components under Agent control</tspan>
  </text>

  <rect x="648" y="118" width="504" height="408" rx="14" class="boundary"/>
  <text x="668" y="145" class="boundary-label">TOE boundary · R1 = relationship, not call direction</text>
  <text x="1132" y="165" class="small" text-anchor="end">Cards = components · tiles = deployed instances</text>

  <rect x="660" y="176" width="225" height="94" rx="14" fill="#c8edf1" stroke="#087e8b" stroke-width="3"/>
  <rect x="915" y="176" width="225" height="94" rx="14" fill="#ffe0b2" stroke="#a86600" stroke-width="3"/>
  <text x="772" y="204" class="type-title" text-anchor="middle">
    <tspan x="772" dy="0">Logical TOE</tspan>
    <tspan x="772" dy="25">Component S</tspan>
    <tspan x="772" dy="21" class="role">Server role</tspan>
  </text>
  <text x="1027" y="204" class="type-title" text-anchor="middle">
    <tspan x="1027" dy="0">Logical TOE</tspan>
    <tspan x="1027" dy="25">Component A</tspan>
    <tspan x="1027" dy="21" class="role">Agent role</tspan>
  </text>

  <line x1="885" y1="232" x2="915" y2="232" stroke="#0b3a67" stroke-width="4" stroke-dasharray="7 5" marker-start="url(#relationship-dot)" marker-end="url(#relationship-dot)"/>
  <text x="900" y="218" class="role" text-anchor="middle">R1</text>

  <path d="M772 270 L772 288 M718 288 L826 288 M718 288 L718 302 M826 288 L826 302" fill="none" stroke="#087e8b" stroke-width="3.5"/>
  <path d="M1027 270 L1027 288 M973 288 L1081 288 M973 288 L973 302 M1081 288 L1081 302" fill="none" stroke="#a86600" stroke-width="3.5"/>

  <rect x="665" y="302" width="106" height="72" rx="10" class="instance-server"/>
  <rect x="773" y="302" width="106" height="72" rx="10" class="instance-server"/>
  <text x="718" y="332" class="tile" text-anchor="middle"><tspan x="718">Instance</tspan><tspan x="718" dy="22">S-1</tspan></text>
  <text x="826" y="332" class="tile" text-anchor="middle"><tspan x="826">Instance</tspan><tspan x="826" dy="22">S-n</tspan></text>

  <rect x="920" y="302" width="106" height="72" rx="10" class="instance-agent"/>
  <rect x="1028" y="302" width="106" height="72" rx="10" class="instance-agent"/>
  <text x="973" y="332" class="tile" text-anchor="middle"><tspan x="973">Instance</tspan><tspan x="973" dy="22">A-1</tspan></text>
  <text x="1081" y="332" class="tile" text-anchor="middle"><tspan x="1081">Instance</tspan><tspan x="1081" dy="22">A-n</tspan></text>

  <rect x="662" y="385" width="476" height="130" rx="12" fill="#fff8e6" stroke="#a86600" stroke-width="2.5"/>
  <text x="900" y="413" class="body" text-anchor="middle">
    <tspan x="900" dy="0">Agent Module control model</tspan>
    <tspan x="900" dy="22">registration using the selected permitted method</tspan>
    <tspan x="900" dy="22">administrator enablement and disablement</tspan>
    <tspan x="900" dy="22">applicable FTP_DIT_EXT.1 communication</tspan>
    <tspan x="900" dy="22">protection</tspan>
  </text>

  <rect x="662" y="545" width="476" height="92" rx="14" fill="#edf9f1" stroke="#287d52" stroke-width="3"/>
  <text x="900" y="574" class="outcome" text-anchor="middle">
    <tspan x="900" dy="0">Distinct TOE Components +</tspan>
    <tspan x="900" dy="26">Agent-model relationship</tspan>
    <tspan x="900" dy="26" class="outcome-detail">Use the Server + Agent PP-Configuration</tspan>
  </text>
</svg>
